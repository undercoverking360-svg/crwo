<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRWO - Cryptocurrency Welfare Organisation</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #020617;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      .crwo-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        z-index: 99999;
        overflow: hidden;
        user-select: none;
      }

      /* 1. Full Screen Pulsing Dot Matrix Background */
      .crwo-dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(45, 212, 191, 0.45) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
        animation: crwoPulseDots 3s ease-in-out infinite alternate;
        pointer-events: none;
      }
      @keyframes crwoPulseDots {
        0% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.65; }
        100% { opacity: 0.35; transform: scale(1.02); }
      }

      /* 2. Ambient Cyber Orbs */
      .crwo-orb {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(20, 184, 166, 0.2) 0%, transparent 70%);
        filter: blur(55px);
        pointer-events: none;
        animation: crwoGlow 5s ease-in-out infinite alternate;
      }
      @keyframes crwoGlow {
        0% { transform: scale(0.85); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.9; }
      }

      /* 3. Transparent CRWO Watermark Background Theme */
      .crwo-bg-watermark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .crwo-bg-watermark span {
        font-size: clamp(75px, 22vw, 200px);
        font-weight: 900;
        letter-spacing: 0.22em;
        color: transparent;
        -webkit-text-stroke: 1.8px rgba(45, 212, 191, 0.25);
        text-shadow: 0 0 50px rgba(20, 184, 166, 0.2);
        text-transform: uppercase;
      }

      /* 4. Center Hologram Rings */
      .crwo-holo-ring {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .crwo-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed rgba(45, 212, 191, 0.65);
        box-shadow: 0 0 25px rgba(20, 184, 166, 0.4);
        animation: crwoSpin 8s linear infinite;
      }
      .crwo-ring-inner {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2px dotted rgba(34, 211, 238, 0.55);
        animation: crwoSpinRev 12s linear infinite;
      }
      .crwo-ring-core {
        position: relative;
        width: 62px;
        height: 62px;
        border-radius: 18px;
        background: linear-gradient(135deg, #091225, #020617);
        border: 1px solid rgba(45, 212, 191, 0.65);
        box-shadow: 0 0 32px rgba(20, 184, 166, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @keyframes crwoSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes crwoSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* 5. Pulse Dot-Dot-Dot Wave */
      .crwo-dots-wave {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 20px 0 16px 0;
      }
      .crwo-pulse-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #2dd4bf;
        box-shadow: 0 0 12px #2dd4bf, 0 0 22px rgba(45, 212, 191, 0.85);
        animation: crwoDotBounce 1.3s infinite ease-in-out;
      }
      .crwo-pulse-dot:nth-child(1) { animation-delay: 0s; }
      .crwo-pulse-dot:nth-child(2) { animation-delay: 0.18s; }
      .crwo-pulse-dot:nth-child(3) { animation-delay: 0.36s; }
      .crwo-pulse-dot:nth-child(4) { animation-delay: 0.54s; }
      .crwo-pulse-dot:nth-child(5) { animation-delay: 0.72s; }
      @keyframes crwoDotBounce {
        0%, 100% {
          transform: translateY(0) scale(0.65);
          opacity: 0.35;
        }
        50% {
          transform: translateY(-8px) scale(1.35);
          opacity: 1;
          box-shadow: 0 0 16px #2dd4bf, 0 0 28px rgba(45, 212, 191, 0.95);
        }
      }

      /* 6. Subtitle & Status Badge */
      .crwo-status-badge {
        padding: 6px 16px;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(45, 212, 191, 0.35);
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: #5eead4;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .crwo-status-line {
        width: 190px;
        height: 2px;
        background: #1e293b;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 10px;
      }
      .crwo-status-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #14b8a6, #22d3ee, #14b8a6);
        box-shadow: 0 0 10px #2dd4bf;
        animation: crwoScan 1.6s ease-in-out infinite;
      }
      @keyframes crwoScan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <script type="module" src="/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <!-- High-tech Instant Pulse Dot & Transparent CRWO Preloader -->
      <div class="crwo-preloader">
        <div class="crwo-dot-grid"></div>
        <div class="crwo-orb"></div>
        <div class="crwo-bg-watermark"><span>CRWO</span></div>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
          <div class="crwo-holo-ring">
            <div class="crwo-ring-outer"></div>
            <div class="crwo-ring-inner"></div>
            <div class="crwo-ring-core">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 8px rgba(45,212,191,0.9));">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
          </div>
          <div style="text-align: center;">
            <div style="font-size: 26px; font-weight: 900; letter-spacing: 0.25em; color: #f0fdfa; text-shadow: 0 0 20px rgba(45,212,191,0.5);">CRWO</div>
            <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: rgba(45,212,191,0.85); text-transform: uppercase; margin-top: 4px;">Cryptocurrency Welfare Organisation</div>
          </div>
          <div class="crwo-dots-wave">
            <div class="crwo-pulse-dot"></div>
            <div class="crwo-pulse-dot"></div>
            <div class="crwo-pulse-dot"></div>
            <div class="crwo-pulse-dot"></div>
            <div class="crwo-pulse-dot"></div>
          </div>
          <div class="crwo-status-badge">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 6px #2dd4bf;"></span>
            <span>SECURE SYSTEM INITIALIZING...</span>
          </div>
          <div class="crwo-status-line">
            <div class="crwo-status-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </body>
</html>
